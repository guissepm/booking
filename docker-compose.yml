services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: enjoythetrip-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: ${APP_NAME:-Enjoythetrip}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-booking}
      DB_USERNAME: ${DB_USERNAME:-booking}
      DB_PASSWORD: ${DB_PASSWORD:-booking}
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      SESSION_LIFETIME: 120
      QUEUE_DRIVER: sync
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: 6379
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      BROADCAST_DRIVER: log
      MAIL_DRIVER: smtp
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
      - memcached

  mysql:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-booking}
      MYSQL_USER: ${DB_USERNAME:-booking}
      MYSQL_PASSWORD: ${DB_PASSWORD:-booking}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped

volumes:
  dbdata:
  storage:
